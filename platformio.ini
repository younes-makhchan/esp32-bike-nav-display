[env:rootmaker]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -I include
    -I src/map_tiles/include
    -I .pio/libdeps/rootmaker/lvgl/src
    -O3

extra_scripts =
    pre:scripts/ensure_ryzobee_symlinks.py
    pre:scripts/gen_companion_html.py

lib_deps = 
    ryzobee/Ryzobee @ ^1.0.5
    lovyan03/LovyanGFX @ ^1.2.19
    adafruit/Adafruit NeoPixel @ ^1.12.3
    bitbank2/AnimatedGIF @ ^2.2.0
    stm32duino/STM32duino LIS2DW12 @ ^2.1.1
    lvgl/lvgl @ ~9.2.2
    bblanchon/ArduinoJson @ ^7.3.0
